name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # lh-gui needs system deps on Linux; core and cli do not. `flac` is the oracle
      # the conversion tests compare against (PLAN.md §6) — without it they skip, so it
      # is installed wherever there is a package for it. Windows has none, and the tests
      # say on stderr that they skipped.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev flac
      - name: Install the reference flac
        if: runner.os == 'macOS'
        run: brew install flac
      - run: cargo test --workspace --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
